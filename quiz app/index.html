<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUIZ APP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quiz_app">
        <div class="quiz_info">
            <div class="category">Category: <span>Web Development</span></div>
            <div class="count">Question Count: <span>0</span></div>
        </div>

        
        <div class="quiz_area"></div>
        <div class="answers_area"></div>

        <button class="submit_btn">Submit</button>

        <div class="bullets">
            <div class="spans"></div>

            <div class="countdown"></div>
        </div>

        <div class="results"></div>
    </div>
    <script src="main.js"></script>
</body>
</html>
